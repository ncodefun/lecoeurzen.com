# Deploys public/ to Firebase Hosting (live channel) on every push to main.
# No build step: firebase.json serves public/ as is.
name: Deploy to Firebase Hosting on push to main

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-hosting-live
  cancel-in-progress: true

jobs:
  deploy_live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LE_COEUR_ZEN }}
          channelId: live
          projectId: le-coeur-zen
