<!DOCTYPE html>
<html lang='fr'>
<head>
	<meta charset='UTF-8'>
	<meta name='viewport' content='width=device-width, initial-scale=1.0'>
	<link rel="icon" href="/images/icons/favicon.ico" sizes="any">
	<link
		rel="icon"
		type="image/png"
		sizes="192x192"
		href="/images/icons/android-chrome-192x192.png"
	>
	<link
		rel="apple-touch-icon"
		sizes="180x180"
		href="/images/icons/apple-touch-icon.png"
	>
	<link rel="manifest" href="/site.webmanifest">

	<title>Le cœur Zen</title>
	<meta name='description' content="L'expérience directe – de la noirceur à la lumière, de la tête jusqu'au cœur – transformer sa vision, libérer son esprit, et sa magie!">
	<script>
		try {
			if (localStorage.getItem('zen-theme') === 'dark') {
				document.documentElement.dataset.theme = 'dark';
			}
		} catch {}
	</script>

	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link
		href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900"
		rel="stylesheet"
	>
	<link rel='stylesheet' href='./styles/styles.css'>
	<script defer src='./scripts/app.js'></script>
</head>
<body>
<main id='main'>

	<div id='logo'>
		<h1>
			<small>Le cœur</small>
			ZEN
		</h1>
		<hr id='zen-sep'>
		<p id='tagline'>Être, <em>c'est tout</em></p>
	</div>

	<div id='subtitle'>
		Libérer son esprit <img class='blue-morpho' src='images/blue-morpho.png' alt='Papillon bleu'> …et sa magie
	</div>

	<div id='subtitle2'>
		<span>Transformation isn't a project</span>,
		<span> it's a way to live…</span>
	</div>

	<dialog id='presentation-fr' class='modal'><h2>L'expérience directe</h2>
		

		— José —
	</dialog>

	<footer>
		<div id='egg'></div>
		<img src='./images/meditation-new2.png' id='meditator' alt='person sitting in meditation'>
		<div id='question-mark' aria-hidden='true'>?</div>

		<button
			id='theme-toggle'
			type='button'
			aria-label='Basculer entre les modes clair et sombre'
			aria-pressed='false'
			>
			<svg
				xmlns="http://www.w3.org/2000/svg"
				width="2rem"
				height="2rem"
				viewBox="0 0 24 24"
				aria-hidden="true"
				>
				<path d="M0 0h24v24H0z" fill="none" />
				<path
					fill="currentColor"
					stroke="currentColor"
					stroke-linecap="round"
					stroke-linejoin="round"
					stroke-width="2"
					d="M9.353 3C5.849 4.408 3 7.463 3 11.47A9.53 9.53 0 0 0 12.53 21c4.007 0 7.062-2.849 8.47-6.353C8.17 17.065 8.14 8.14 9.353 3"
				/>
			</svg>
		</button>
		<div id='contact'>
			<a href='mailto:contact@lecoeurzen.com'><b>contact</b>@<b>LeCoeurZen</b>.com</a>
		</div>
	</footer>

</main>
</body>
</html>
